agents:
  tech_researcher:
    type: "agent"
    name: "TechResearcher"
    model: "gemini-2.5-flash-lite"
    description: "Focuses on AI and ML trends."
    instruction: >

      Research the latest AI/ML trends. Include 3 key developments,
      the main companies involved, and the potential impact. Keep the report very concise (100 words).

    api-key: ${GOOGLE_API_KEY}
    output_key: "tech_research"

  health_researcher:
    type: "agent"
    name: "HealthResearcher"
    model: "gemini-2.5-flash-lite"
    description: "Focuses on medical breakthroughs."
    instruction: >

      Research recent medical breakthroughs. Include 3 significant advances,
      their practical applications, and estimated timelines. Keep the report concise (100 words).

    api-key: ${GOOGLE_API_KEY}
    output_key: "health_research"

  finance_researcher:
    type: "agent"
    name: "FinanceResearcher"
    model: "gemini-2.5-flash-lite"
    description: "Focuses on fintech trends."
    instruction: >

      Research current fintech trends. Include 3 key trends,
      their market implications, and the future outlook. Keep the report concise (100 words).

    api-key: ${GOOGLE_API_KEY}
    output_key: "finance_research"

  aggregator_agent:
    type: "agent"
    name: "AggregatorAgent"
    model: "gemini-2.5-flash-lite"
    description: "runs *after* the parallel step to synthesize the results."
    instruction: >

      Combine these three research findings into a single executive summary:

      **Technology Trends:**
      {tech_research}

      **Health Breakthroughs:**
      {health_research}

      **Finance Innovations:**
      {finance_research}

      Your summary should highlight common themes, surprising connections, and the most important key takeaways from all three reports. The final summary should be around 200 words.

    api-key: ${GOOGLE_API_KEY}
    output_key: "executive_summary"

  parallel_research_team:
    type: "parallel-agent"
    workflow: "parallel"
    name: "ParallelResearchTeam"
    sub_agents:
      - tech_researcher
      - health_researcher
      - finance_researcher

  root_agent:
    type: "root-agent"
    workflow: "sequential"
    name: "ResearchSystem"
    model: "gemini-2.5-flash-lite"
    arguments: ${ROOT_AGENT_ARGUMENTS}
    sub_agents:
      - parallel_research_team
      - aggregator_agent
# memory:

agents:
  initial_writer_agent:
    type: "agent"
    name: "InitialWriterAgent"
    model: "gemini-2.5-flash-lite"
    description: "runs ONCE at the beginning to create the first draft."
    instruction: >

      Based on the user's prompt, write the first draft of a short story (around 100-150 words).
      Output only the story text, with no introduction or explanation.

    api-key: ${GOOGLE_API_KEY}
    output_key: "current_story"

  critic_agent:
    type: "agent"
    name: "CriticAgent"
    model: "gemini-2.5-flash-lite"
    description: "provide feedback or the approval signal."
    instruction: >

      You are a constructive story critic. Review the story provided below.
      Story: {current_story}

      Evaluate the story's plot, characters, and pacing.
      - If the story is well-written and complete, you MUST respond with the exact phrase: "APPROVED"
      - Otherwise, provide 2-3 specific, actionable suggestions for improvement.

    api-key: ${GOOGLE_API_KEY}
    output_key: "critique"

  refiner_agent:
    type: "agent"
    name: "RefinerAgent"
    model: "gemini-2.5-flash-lite"
    description: "refines the story based on critique OR calls the exit_loop function"
    instruction: >

      You are a story refiner. You have a story draft and critique.

      Story Draft: {current_story}
      Critique: {critique}

      Your task is to analyze the critique.
      - IF the critique is EXACTLY "APPROVED", you MUST call the `exit_loop` function and nothing else.
      - OTHERWISE, rewrite the story draft to fully incorporate the feedback from the critique.

    api-key: ${GOOGLE_API_KEY}
    tools:
      functions:
        - ${EXAMPLES_DIRECTORY}/05-loop-agent-with-tool/exit_loop.py
          
    output_key: "current_story"

  story_refinement_loop:
    type: "loop"
    workflow: "loop"
    name: "StoryRefinementLoop"
    model: "gemini-2.5-flash-lite"
    description: "agents that will run repeatedly: Critic -> Refiner"
    api-key: ${GOOGLE_API_KEY}
    output_key: "executive_summary"
    max_iterations: 2
    sub_agents:
      - critic_agent
      - refiner_agent

  root_agent:
    type: "root-agent"
    workflow: "sequential"
    name: "StoryPipeline"
    model: "gemini-2.5-flash-lite"
    arguments: ${ROOT_AGENT_ARGUMENTS}
    sub_agents:
      - initial_writer_agent
      - story_refinement_loop

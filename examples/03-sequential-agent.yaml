agents:
  outline_agent:
    type: "agent"
    name: "OutlineAgent"
    model: "gemini-2.5-flash-lite"
    description: "Creates the initial blog post outline."
    instruction: >

      Create a blog outline for the given topic with:
      1. A catchy headline
      2. An introduction hook
      3. 3-5 main sections with 2-3 bullet points for each
      4. A concluding thought

    api-key: ${GOOGLE_API_KEY}
    output_key: "blog_outline"

  writer_agent:
    type: "agent"
    name: "WriterAgent"
    model: "gemini-2.5-flash-lite"
    description: "Writes the full blog post based on the outline from the previous agent."
    instruction: >

      Following this outline strictly: {blog_outline}
      Write a brief, 200 to 300-word blog post with an engaging and informative tone.

    api-key: ${GOOGLE_API_KEY}
    output_key: "blog_draft"

  editor_agent:
    type: "agent"
    name: "EditorAgent"
    model: "gemini-2.5-flash-lite"
    description: "Edits and polishes the draft from the writer agent."
    instruction: >

      Edit this draft: {blog_draft}
      Your task is to polish the text by fixing any grammatical errors, improving the flow and sentence structure, and enhancing overall clarity.

    api-key: ${GOOGLE_API_KEY}
    output_key: "final_blog"

  root_agent:
    type: "root-agent"
    workflow: "sequential"
    name: "BlogPipeline"
    model: "gemini-2.5-flash-lite"
    arguments: ${ROOT_AGENT_ARGUMENTS}
    tools:
      agents:
        - outline_agent
        - writer_agent
        - editor_agent
